services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memora_postgres
    restart: always
    environment:
      POSTGRES_DB: memora_db
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora_secret
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
    driver: local
